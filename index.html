<script>
  // 1. UPDATED COMPONENT: Checks visibility before making clickable
  AFRAME.registerComponent('manage-distance-state', {
    schema: { 
      originalColor: { type: 'string', default: 'red' },
      unlockDistance: { type: 'number', default: 100 } // 100 meters
    },
    tick: function () {
      var camera = document.querySelector('a-camera').object3D;
      var wrapper = this.el.object3D;
      
      var distance = wrapper.position.distanceTo(camera.position);
      
      var newScale = Math.max(5, distance * 0.1); 
      this.el.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);

      var box = this.el.querySelector('.shape-box');
      var img = this.el.querySelector('.shape-image');
      var text = this.el.querySelector('a-text');
      
      if (distance <= this.data.unlockDistance) {
        // ACTIVE STATE
        if (box) {
          box.setAttribute('color', this.data.originalColor);
          box.setAttribute('opacity', '1.0');
          // Only add clickable if it's currently visible
          if (box.getAttribute('visible')) box.classList.add('clickable');
        }
        if (img) {
          img.setAttribute('opacity', '1.0');
          if (img.getAttribute('visible')) img.classList.add('clickable');
        }
        if (text) text.setAttribute('opacity', '1.0');
      } else {
        // INACTIVE STATE
        if (box) {
          box.setAttribute('color', 'gray');
          box.setAttribute('opacity', '0.3');
          box.classList.remove('clickable');
        }
        if (img) {
          img.setAttribute('opacity', '0.3');
          img.classList.remove('clickable');
        }
        if (text) text.setAttribute('opacity', '0.5'); 
      }
    }
  });

  // 2. UPDATED LINK COMPONENT: Failsafe to ensure hidden items cannot be clicked
  AFRAME.registerComponent('open-link', {
    schema: { url: { type: 'string', default: '' } },
    init: function () {
      this.el.addEventListener('click', (evt) => {
        // Failsafe: Ignore the click if the element is invisible or has no URL
        if (!this.el.getAttribute('visible')) return;
        
        if (this.data.url && this.data.url !== '#') {
          window.location.href = this.data.url;
        }
      });
    }
  });
</script>
