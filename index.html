<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebAR + Tracking Map</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      AFRAME.registerComponent('scale-by-distance', {
        tick: function () {
          var camera = document.querySelector('a-camera').object3D;
          var box = this.el.object3D;
          var distance = box.position.distanceTo(camera.position);
          var newScale = Math.max(5, distance * 0.1); 
          this.el.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
        }
      });
    </script>

    <style>
      body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
      #ar-container { height: 50%; width: 100%; position: relative; }
      #map-container { height: 50%; width: 100%; }
      #ar-container video { object-fit: cover; }
    </style>
  </head>
  <body>
    
    <div id="ar-container">
      <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
      >
        <a-camera gps-camera rotation-reader near="0.1" far="5000"></a-camera>

        <a-box color="red" gps-entity-place="latitude: 39.111285807437675; longitude: 26.55744215838956;" position="0 5 0" scale-by-distance></a-box>
        <a-box color="blue" gps-entity-place="latitude: 39.11161250638677; longitude: 26.55834494382977;" position="0 5 0" scale-by-distance></a-box>
        <a-box color="green" gps-entity-place="latitude: 39.11245132108184; longitude: 26.558762197607667;" position="0 5 0" scale-by-distance></a-box>
        <a-box color="yellow" gps-entity-place="latitude: 39.113069388689055; longitude: 26.560013958978683;" position="0 5 0" scale-by-distance></a-box>
        <a-box color="purple" gps-entity-place="latitude: 39.11321360368077; longitude: 26.561102612009524;" position="0 5 0" scale-by-distance></a-box>
        <a-box color="orange" gps-entity-place="latitude: 39.11293694608975; longitude: 26.562718522083177;" position="0 5 0" scale-by-distance></a-box>
      </a-scene>
    </div>

    <div id="map-container"></div>

    <script>
      // Initialize the Leaflet map
      var map = L.map('map-container').setView([39.1124, 26.5595], 15);

      // Load the OpenStreetMap tiles
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Define your box locations
      var locations = [
        { lat: 39.111285807437675, lng: 26.55744215838956, name: "Red Box" },
        { lat: 39.11161250638677, lng: 26.55834494382977, name: "Blue Box" },
        { lat: 39.11245132108184, lng: 26.558762197607667, name: "Green Box" },
        { lat: 39.113069388689055, lng: 26.560013958978683, name: "Yellow Box" },
        { lat: 39.11321360368077, lng: 26.561102612009524, name: "Purple Box" },
        { lat: 39.11293694608975, lng: 26.562718522083177, name: "Orange Box" }
      ];

      // Add box markers to the map
      locations.forEach(function(loc) {
        L.marker([loc.lat, loc.lng]).addTo(map).bindPopup(loc.name);
      });

      // --- USER TRACKING LOGIC ---
      var userMarker;

      // watch: true tells the map to continuously listen for GPS updates
      map.locate({ watch: true, setView: true, maxZoom: 16, enableHighAccuracy: true });

      map.on('locationfound', function(e) {
        if (!userMarker) {
          // If the marker doesn't exist yet, create it
          userMarker = L.circleMarker(e.latlng, { 
            radius: 8, 
            color: 'dodgerblue', 
            fillColor: 'dodgerblue', 
            fillOpacity: 0.8 
          }).addTo(map).bindPopup("You are here");
        } else {
          // If it exists, just update its coordinates so it glides to your new spot
          userMarker.setLatLng(e.latlng);
        }
      });

      map.on('locationerror', function(e) {
        console.warn("Could not get location:", e.message);
      });
    </script>
    
  </body>
</html>
