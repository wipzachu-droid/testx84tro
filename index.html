<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebAR - Proximity Unlock (Layered)</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      // 1. COMPONENT: Manages Scale, Clickability, and 3D Materials
      AFRAME.registerComponent('manage-distance-state', {
        schema: { 
          unlockDistance: { type: 'number', default: 100 } // 100 meters
        },
        init: function() {
          this.isUnlocked = null;
          this.modelLoaded = false;
          
          this.el.addEventListener('model-loaded', () => {
            this.modelLoaded = true;
            this.updateState();
          });
        },
        tick: function () {
          var camera = document.querySelector('a-camera').object3D;
          var wrapper = this.el.object3D;
          
          var distance = wrapper.position.distanceTo(camera.position);
          var newScale = Math.max(5, distance * 0.1); 
          this.el.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);

          var shouldBeUnlocked = distance <= this.data.unlockDistance;

          if (this.isUnlocked !== shouldBeUnlocked) {
            this.isUnlocked = shouldBeUnlocked;
            this.updateState();
          }
        },
        updateState: function() {
          var modelEntity = this.el.querySelector('.shape-model');
          var text = this.el.querySelector('a-text');
          
          // CRITICAL: Check if the current layer is actually visible
          var isVisible = this.el.getAttribute('visible');
          
          // --- 1. A-FRAME ATTRIBUTES ---
          if (this.isUnlocked && isVisible) { // Must be close AND on the active layer
            if (modelEntity) modelEntity.classList.add('clickable');
            if (text) text.setAttribute('opacity', '1.0');
          } else {
            if (modelEntity) modelEntity.classList.remove('clickable'); // Prevents hidden clicks
            if (text) text.setAttribute('opacity', '0.5'); 
          }

          // --- 2. THREE.JS MATERIAL TRAVERSAL ---
          if (modelEntity && this.modelLoaded) {
            var mesh = modelEntity.getObject3D('mesh');
            if (mesh) {
              mesh.traverse((node) => {
                if (node.isMesh && node.material) {
                  node.material.transparent = true;
                  
                  if (this.isUnlocked) {
                    node.material.opacity = 1.0;
                    node.material.color = new THREE.Color('#FFFFFF'); 
                  } else {
                    node.material.opacity = 0.4;
                    node.material.color = new THREE.Color('#555555'); 
                  }
                  
                  node.material.needsUpdate = true;
                }
              });
            }
          }
        }
      });

      // 2. COMPONENT: Clickable Link Failsafe
      AFRAME.registerComponent('open-link', {
        schema: { url: { type: 'string', default: '' } },
        init: function () {
          this.el.addEventListener('click', (evt) => {
            // Extra failsafe to ensure invisible items do not process clicks
            if (!this.el.parentEl.getAttribute('visible')) return;

            if (this.data.url && this.data.url !== '#') {
              window.location.href = this.data.url;
            }
          });
        }
      });
    </script>

    <style>
      body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: sans-serif; }
      #ar-container { height: 50%; width: 100%; position: relative; }
      #map-container { height: 50%; width: 100%; }
      #ar-container video { object-fit: cover; }
      
      /* UI Controls */
      #ui-controls {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
      }
      button {
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        background-color: #ffffff;
        color: #333;
        border: 2px solid #333;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
        transition: 0.2s;
      }
      button:active {
        background-color: #e0e0e0;
      }
    </style>
  </head>
  <body>
    
    <div id="ar-container">
      
      <div id="ui-controls">
        <button id="toggleLayerBtn">Showing Layer 1 (Loc 1-6)</button>
      </div>

      <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"
      >
        <a-camera gps-camera rotation-reader near="0.1" far="5000"></a-camera>

        <a-assets>
          <a-asset-item id="custom-model" src="assets/mappoint.glb"></a-asset-item>
        </a-assets>

        <a-entity class="ar-loc layer-1" visible="true" gps-entity-place="latitude: 39.109621384126825; longitude: 26.565955633631958;" manage-distance-state>
          <a-entity gltf-model="#custom-model" class="shape-model" open-link="url: https://en.wikipedia.org/wiki/Red" position="0 0 0"></a-entity>
          <a-text value="Location 1" color="white" align="center" position="0 2 0" look-at="[gps-camera]"></a-text>
        </a-entity>

        <a-entity class="ar-loc layer-1" visible="true" gps-entity-place="latitude: 39.10857606378002; longitude: 26.556846506429483;" manage-distance-state>
          <a-entity gltf-model="#custom-model" class="shape-model" open-link="url: https://en.wikipedia.org/wiki/Red" position="0 0 0"></a-entity>
          <a-text value="Location 2" color="white" align="center" position="0 2 0" look-at="[gps-camera]"></a-text>
        </a-entity>

        <a-entity class="ar-loc layer-1" visible="true" gps-entity-place="latitude: 39.111285807437675; longitude: 26.55744215838956;" manage-distance-state>
          <a-entity gltf-model="#custom-model" class="shape-model" open-link="url: https://en.wikipedia.org/wiki/Red" position="0 0 0"></a-entity>
          <a-text value="Location 3" color="white" align="center" position="0 2 0" look-at="[gps-camera]"></a-text>
        </a-entity>

        <a-entity class="ar-loc layer-1" visible="true" gps-entity-place="latitude: 39.11161250638677; longitude: 26.55834494382977;" manage-distance-state>
          <a-entity gltf-model="#custom-model" class="shape-model" open-link="url: https://en.wikipedia.org/wiki/Blue" position="0 0 0"></a-entity>
          <a-text value="Location 4" color="white" align="center" position="0 2 0" look-at="[gps-camera]"></a-text>
        </a-entity>

        <a-entity class="ar-loc layer-1" visible="true" gps-entity-place="latitude: 39.11245132108184; longitude: 26.558762197607667;" manage-distance-state>
          <a-entity gltf-model="#custom-model" class="shape-model" open-link="url: https://en.wikipedia.org/wiki/Green" position="0 0 0"></a-entity>
          <a-text value="Location 5" color="white" align="center" position="0 2 0" look-at="[gps-camera]"></a-text>
        </a-entity>

        <a-entity class="ar-loc layer-1" visible="true" gps-entity-place="latitude: 39.113069388689055; longitude: 26.560013958978683;" manage-distance-state>
          <a-entity gltf-model="#custom-model" class="shape-model" open-link="url: https://en.wikipedia.org/wiki/Yellow" position="0 0 0"></a-entity>
          <a-text value="Location 6" color="white" align="center" position="0 2 0" look-at="[gps-camera]"></a-text>
        </a-entity>


        <a-entity class="ar-loc layer-2" visible="false" gps-entity-place="latitude: 39.11321360368077; longitude: 26.561102612009524;" manage-distance-state>
          <a-entity gltf-model="#custom-model" class="shape-model" open-link="url: https://en.wikipedia.org/wiki/Purple" position="0 0 0"></a-entity>
          <a-text value="Location 7" color="white" align="center" position="0 2 0" look-at="[gps-camera]"></a-text>
        </a-entity>

        <a-entity class="ar-loc layer-2" visible="false" gps-entity-place="latitude: 39.11293694608975; longitude: 26.562718522083177;" manage-distance-state>
          <a-entity gltf-model="#custom-model" class="shape-model" open-link="url: https://en.wikipedia.org/wiki/Orange_(colour)" position="0 0 0"></a-entity>
          <a-text value="Location 8" color="white" align="center" position="0 2 0" look-at="[gps-camera]"></a-text>
        </a-entity>

        <a-entity class="ar-loc layer-2" visible="false" gps-entity-place="latitude: 39.112522245165536; longitude: 26.55472019777063;" manage-distance-state>
          <a-entity gltf-model="#custom-model" class="shape-model" open-link="url: #" position="0 0 0"></a-entity>
          <a-text value="Location 9" color="white" align="center" position="0 2 0" look-at="[gps-camera]"></a-text>
        </a-entity>

        <a-entity class="ar-loc layer-2" visible="false" gps-entity-place="latitude: 39.11313293752422; longitude: 26.561410299736572;" manage-distance-state>
          <a-entity gltf-model="#custom-model" class="shape-model" open-link="url: #" position="0 0 0"></a-entity>
          <a-text value="Location 10" color="white" align="center" position="0 2 0" look-at="[gps-camera]"></a-text>
        </a-entity>

        <a-entity class="ar-loc layer-2" visible="false" gps-entity-place="latitude: 39.11116343567997; longitude: 26.555408884737712;" manage-distance-state>
          <a-entity gltf-model="#custom-model" class="shape-model" open-link="url: #" position="0 0 0"></a-entity>
          <a-text value="Location 11" color="white" align="center" position="0 2 0" look-at="[gps-camera]"></a-text>
        </a-entity>

      </a-scene>
    </div>

    <div id="map-container"></div>

    <script>
      // --- Toggle Logic ---
      let isLayer1Active = true;
      let btn = document.getElementById('toggleLayerBtn');

      // Stop touch inputs from bleeding through to the AR canvas below
      btn.addEventListener('pointerdown', e => e.stopPropagation());
      
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        isLayer1Active = !isLayer1Active;
        btn.innerText = isLayer1Active ? "Showing Layer 1 (Loc 1-6)" : "Showing Layer 2 (Loc 7-11)";

        // 1. Toggle AR Scene Visibility
        document.querySelectorAll('.ar-loc').forEach(el => {
          let isLayer1Item = el.classList.contains('layer-1');
          let shouldBeVisible = isLayer1Active ? isLayer1Item : !isLayer1Item;
          
          el.setAttribute('visible', shouldBeVisible);
          
          // Force the state check to immediately add/remove clickability 
          if (el.components['manage-distance-state']) {
            el.components['manage-distance-state'].updateState();
          }
        });

        // 2. Toggle Map Markers
        if (isLayer1Active) {
          map.addLayer(mapLayer1Group);
          map.removeLayer(mapLayer2Group);
        } else {
          map.addLayer(mapLayer2Group);
          map.removeLayer(mapLayer1Group);
        }
      });


      // --- Map Logic ---
      var map = L.map('map-container').setView([39.1124, 26.5595], 15);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Create two distinct layer groups for Leaflet
      var mapLayer1Group = L.layerGroup().addTo(map); // Layer 1 active by default
      var mapLayer2Group = L.layerGroup();

      var locations = [
        { lat: 39.109621384126825, lng: 26.565955633631958, name: "Location 1", layer: 1, url: "https://en.wikipedia.org/wiki/Red" },
        { lat: 39.10857606378002, lng: 26.556846506429483, name: "Location 2", layer: 1, url: "https://en.wikipedia.org/wiki/Red" },
        { lat: 39.111285807437675, lng: 26.55744215838956, name: "Location 3", layer: 1, url: "https://en.wikipedia.org/wiki/Red" },
        { lat: 39.11161250638677, lng: 26.55834494382977, name: "Location 4", layer: 1, url: "https://en.wikipedia.org/wiki/Blue" },
        { lat: 39.11245132108184, lng: 26.558762197607667, name: "Location 5", layer: 1, url: "https://en.wikipedia.org/wiki/Green" },
        { lat: 39.113069388689055, lng: 26.560013958978683, name: "Location 6", layer: 1, url: "https://en.wikipedia.org/wiki/Yellow" },
        
        { lat: 39.11321360368077, lng: 26.561102612009524, name: "Location 7", layer: 2, url: "https://en.wikipedia.org/wiki/Purple" },
        { lat: 39.11293694608975, lng: 26.562718522083177, name: "Location 8", layer: 2, url: "https://en.wikipedia.org/wiki/Orange_(colour)" },
        { lat: 39.112522245165536, lng: 26.55472019777063, name: "Location 9", layer: 2, url: "#" },
        { lat: 39.11313293752422, lng: 26.561410299736572, name: "Location 10", layer: 2, url: "#" },
        { lat: 39.11116343567997, lng: 26.555408884737712, name: "Location 11", layer: 2, url: "#" }
      ];

      // Distribute markers to their correct groups
      locations.forEach(function(loc) {
        var popupContent = `<b>${loc.name}</b><br><a href="${loc.url}">Click here to visit website</a>`;
        var marker = L.marker([loc.lat, loc.lng]).bindPopup(popupContent);
        
        if (loc.layer === 1) {
          mapLayer1Group.addLayer(marker);
        } else {
          mapLayer2Group.addLayer(marker);
        }
      });

      // User location marker logic
      var userMarker;
      map.locate({ watch: true, setView: true, maxZoom: 16, enableHighAccuracy: true });

      map.on('locationfound', function(e) {
        if (!userMarker) {
          userMarker = L.circleMarker(e.latlng, { 
            radius: 8, 
            color: 'dodgerblue', 
            fillColor: 'dodgerblue', 
            fillOpacity: 0.8 
          }).addTo(map).bindPopup("You are here");
        } else {
          userMarker.setLatLng(e.latlng);
        }
      });
    </script>
    
  </body>
</html>
