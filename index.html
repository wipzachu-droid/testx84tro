<script>
  var TARGET = { lat: 39.109624, lon: 26.565453 };
  var statusEl = document.getElementById("gps-status");
  var gotFix = false;

  function distance(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function showOK(lat, lon, src) {
    gotFix = true;
    var d = distance(lat, lon, TARGET.lat, TARGET.lon);
    statusEl.className = "ok";
    statusEl.innerHTML =
      '<span class="big">✅ Location OK</span><br>' +
      'You: ' + lat.toFixed(6) + ', ' + lon.toFixed(6) + '<br>' +
      'Distance to target: ' + d.toFixed(1) + ' m' +
      ' <span style="opacity:.7">(' + src + ')</span>';
  }

  // Listen for ALL the event names AR.js versions use
  ["gps-camera-update-position", "gps-update-position"].forEach(function (name) {
    window.addEventListener(name, function (e) {
      var p = (e.detail && (e.detail.position || e.detail)) || {};
      if (p.latitude != null) showOK(p.latitude, p.longitude, "ar.js event");
    });
  });

  // Backup: read the camera's own position attribute every second
  var cam = document.querySelector("[gps-camera]");
  var poll = setInterval(function () {
    if (!cam || !cam.components) return;
    var comp = cam.components["gps-camera"];
    if (comp && comp.currentCoords) {
      showOK(comp.currentCoords.latitude, comp.currentCoords.longitude, "poll");
    }
  }, 1000);

  // Independent check: raw browser geolocation (proves permission works)
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(
      function (pos) {
        if (!gotFix) {
          showOK(pos.coords.latitude, pos.coords.longitude, "browser");
        }
      },
      function (err) {
        if (!gotFix) {
          statusEl.className = "err";
          statusEl.innerHTML =
            '<span class="big">❌ Geolocation: ' + err.message + '</span>';
          console.error("geolocation error", err);
        }
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
    );
  }

  // Longer fallback warning
  setTimeout(function () {
    if (!gotFix) {
      statusEl.className = "err";
      statusEl.innerHTML =
        '<span class="big">❌ No position after 20s</span><br>' +
        'Permissions look on — likely indoors / weak GPS, or simulate values active.';
    }
  }, 20000);
</script>
