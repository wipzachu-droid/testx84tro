<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WebAR Red Box</title>
    <!-- Import A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <!-- Set up the A-Frame scene -->
    <!-- webxr="referenceSpaceType: local" sets up a simulated local space -->
    <a-scene webxr="referenceSpaceType: local">
      
      <!-- The Camera Entity -->
      <a-entity camera position="0 1.6 0">
        
        <!-- 
          The Red Box 
          Positioned 0 on X and Y, and -2 on Z (which means 2 meters directly in front of the camera)
        -->
        <a-box 
          color="red" 
          position="0 0 -2" 
          scale="0.5 0.5 0.5">
        </a-box>
        
      </a-entity>
      
    </a-scene>
  </body>
</html>
