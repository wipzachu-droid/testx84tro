<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebAR - Multiple Distance Scaled Boxes</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script>
      AFRAME.registerComponent('scale-by-distance', {
        tick: function () {
          // Get the camera and the box's 3D position
          var camera = document.querySelector('a-camera').object3D;
          var box = this.el.object3D;
          
          // Calculate distance between you and the box
          var distance = box.position.distanceTo(camera.position);
          
          // Scale the box up based on distance (minimum size is 5)
          // Adjust the '0.1' multiplier if you want them to grow faster/slower
          var newScale = Math.max(5, distance * 0.1); 
          
          this.el.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <a-scene
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    >
      <a-camera gps-camera rotation-reader near="0.1" far="5000"></a-camera>

      <a-box 
        color="red" 
        gps-entity-place="latitude: 39.110349028867645; longitude: 26.557598223106215;" 
        position="0 5 0"
        scale-by-distance>
      </a-box>

      <a-box 
        color="blue" 
        gps-entity-place="latitude: 39.11197235634995; longitude: 26.559389938619212;" 
        position="0 5 0"
        scale-by-distance>
      </a-box>

      <a-box 
        color="green" 
        gps-entity-place="latitude: 39.11148119967233; longitude: 26.55985127854172;" 
        position="0 5 0"
        scale-by-distance>
      </a-box>
      
    </a-scene>
    
  </body>
</html>
