<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      #gps-status {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 9999;
        font-family: sans-serif;
        font-size: 14px;
        line-height: 1.5;
        padding: 10px 12px;
        color: #fff;
        background: rgba(0, 0, 0, 0.6);
        transition: background 0.3s;
      }
      #gps-status.ok { background: rgba(20, 140, 40, 0.85); }
      #gps-status.wait { background: rgba(180, 120, 0, 0.85); }
      #gps-status.err { background: rgba(170, 30, 30, 0.9); }
      #gps-status .big { font-weight: bold; font-size: 15px; }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div id="gps-status" class="wait">
      <span class="big">⏳ Waiting for location…</span>
    </div>

    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    >
      <a-image
        id="target"
        src="assets/point.png"
        look-at="[gps-camera]"
        scale="20 20 20"
        material="transparent: true; alphaTest: 0.5;"
        gps-entity-place="latitude: 39.109624; longitude: 26.565453;"
      ></a-image>

      <!-- Real GPS test (use outdoors): -->
      <a-camera gps-camera rotation-reader></a-camera>

      <!-- Fake-location test (swap in instead of the line above):
      <a-camera
        gps-camera="simulateLatitude: 39.109600; simulateLongitude: 26.565453;"
        rotation-reader
      ></a-camera>
      -->
    </a-scene>

    <script>
      var TARGET = { lat: 39.08451785964809, lon: 26.56924178443976 };
      var statusEl = document.getElementById("gps-status");
      var gotFix = false;

      function distance(lat1, lon1, lat2, lon2) {
        var R = 6371000;
        var dLat = (lat2 - lat1) * Math.PI / 180;
        var dLon = (lon2 - lon1) * Math.PI / 180;
        var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function showOK(lat, lon, src) {
        gotFix = true;
        var d = distance(lat, lon, TARGET.lat, TARGET.lon);
        statusEl.className = "ok";
        statusEl.innerHTML =
          '<span class="big">✅ Location OK</span><br>' +
          'You: ' + lat.toFixed(6) + ', ' + lon.toFixed(6) + '<br>' +
          'Distance to target: ' + d.toFixed(1) + ' m' +
          ' <span style="opacity:.7">(' + src + ')</span>';
      }

      // Listen for all event names AR.js versions emit
      ["gps-camera-update-position", "gps-update-position"].forEach(function (name) {
        window.addEventListener(name, function (e) {
          var p = (e.detail && (e.detail.position || e.detail)) || {};
          if (p.latitude != null) showOK(p.latitude, p.longitude, "ar.js event");
        });
      });

      // Backup: poll the camera's own coords every second
      var poll = setInterval(function () {
        var cam = document.querySelector("[gps-camera]");
        if (!cam || !cam.components) return;
        var comp = cam.components["gps-camera"];
        if (comp && comp.currentCoords) {
          showOK(comp.currentCoords.latitude, comp.currentCoords.longitude, "poll");
        }
      }, 1000);

      // Independent check: raw browser geolocation (proves permission works)
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          function (pos) {
            if (!gotFix) showOK(pos.coords.latitude, pos.coords.longitude, "browser");
          },
          function (err) {
            if (!gotFix) {
              statusEl.className = "err";
              statusEl.innerHTML =
                '<span class="big">❌ Geolocation: ' + err.message + '</span>';
              console.error("geolocation error", err);
            }
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
        );
      } else {
        statusEl.className = "err";
        statusEl.innerHTML = '<span class="big">❌ Geolocation not supported</span>';
      }

      // Catch AR.js GPS errors
      window.addEventListener("gps-camera-error", function (e) {
        if (!gotFix) {
          statusEl.className = "err";
          statusEl.innerHTML =
            '<span class="big">❌ AR.js location error</span><br>See console.';
          console.error("gps-camera-error", e.detail);
        }
      });

      // Fallback warning after 20s
      setTimeout(function () {
        if (!gotFix) {
          statusEl.className = "err";
          statusEl.innerHTML =
            '<span class="big">❌ No position after 20s</span><br>' +
            'Permissions look on — likely indoors / weak GPS, or simulate values active.';
        }
      }, 20000);
    </script>
  </body>
</html>
