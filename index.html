<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebAR - Image Markers</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      // 1. UPDATED COMPONENT: Targets a-image and manages opacity/clickability
      AFRAME.registerComponent('manage-distance-state', {
        schema: { 
          unlockDistance: { type: 'number', default: 100 } // 100 meters
        },
        tick: function () {
          var camera = document.querySelector('a-camera').object3D;
          var wrapper = this.el.object3D;
          
          var distance = wrapper.position.distanceTo(camera.position);
          
          var newScale = Math.max(5, distance * 0.1); 
          this.el.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);

          // Look for an image instead of a box
          var img = this.el.querySelector('a-image');
          if (!img) return;

          if (distance <= this.data.unlockDistance) {
            // ACTIVE STATE
            img.setAttribute('opacity', '1.0');
            img.classList.add('clickable'); 
          } else {
            // INACTIVE STATE (Ghost image)
            img.setAttribute('opacity', '0.3'); 
            img.classList.remove('clickable'); 
          }
        }
      });

      // 2. Clickable Link Component
      AFRAME.registerComponent('open-link', {
        schema: { url: { type: 'string', default: '' } },
        init: function () {
          this.el.addEventListener('click', () => {
            if (this.data.url) {
              window.location.href = this.data.url;
            }
          });
        }
      });
    </script>

    <style>
      body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
      #ar-container { height: 50%; width: 100%; position: relative; }
      #map-container { height: 50%; width: 100%; }
      #ar-container video { object-fit: cover; }
    </style>
  </head>
  <body>
    
    <div id="ar-container">
      <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"
      >
        <a-assets>
          <img id="point-img" src="assets/point.png">
        </a-assets>

        <a-camera gps-camera rotation-reader near="0.1" far="5000"></a-camera>

        <a-entity gps-entity-place="latitude: 39.111285807437675; longitude: 26.55744215838956;" manage-distance-state>
          <a-image src="#point-img" look-at="[gps-camera]" open-link="url: https://en.wikipedia.org/wiki/Red" position="0 0 0"></a-image>
        </a-entity>

        <a-entity gps-entity-place="latitude: 39.11161250638677; longitude: 26.55834494382977;" manage-distance-state>
          <a-image src="#point-img" look-at="[gps-camera]" open-link="url: https://en.wikipedia.org/wiki/Blue" position="0 0 0"></a-image>
        </a-entity>

        <a-entity gps-entity-place="latitude: 39.11245132108184; longitude: 26.558762197607667;" manage-distance-state>
          <a-image src="#point-img" look-at="[gps-camera]" open-link="url: https://en.wikipedia.org/wiki/Green" position="0 0 0"></a-image>
        </a-entity>

        <a-entity gps-entity-place="latitude: 39.113069388689055; longitude: 26.560013958978683;" manage-distance-state>
          <a-image src="#point-img" look-at="[gps-camera]" open-link="url: https://en.wikipedia.org/wiki/Yellow" position="0 0 0"></a-image>
        </a-entity>

        <a-entity gps-entity-place="latitude: 39.11321360368077; longitude: 26.561102612009524;" manage-distance-state>
          <a-image src="#point-img" look-at="[gps-camera]" open-link="url: https://en.wikipedia.org/wiki/Purple" position="0 0 0"></a-image>
        </a-entity>

        <a-entity gps-entity-place="latitude: 39.11293694608975; longitude: 26.562718522083177;" manage-distance-state>
          <a-image src="#point-img" look-at="[gps-camera]" open-link="url: https://en.wikipedia.org/wiki/Orange_(colour)" position="0 0 0"></a-image>
        </a-entity>

      </a-scene>
    </div>

    <div id="map-container"></div>

    <script>
      var map = L.map('map-container').setView([39.1124, 26.5595], 15);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      var locations = [
        { lat: 39.111285807437675, lng: 26.55744215838956, name: "Location 1", url: "https://en.wikipedia.org/wiki/Red" },
        { lat: 39.11161250638677, lng: 26.55834494382977, name: "Location 2", url: "https://en.wikipedia.org/wiki/Blue" },
        { lat: 39.11245132108184, lng: 26.558762197607667, name: "Location 3", url: "https://en.wikipedia.org/wiki/Green" },
        { lat: 39.113069388689055, lng: 26.560013958978683, name: "Location 4", url: "https://en.wikipedia.org/wiki/Yellow" },
        { lat: 39.11321360368077, lng: 26.561102612009524, name: "Location 5", url: "https://en.wikipedia.org/wiki/Purple" },
        { lat: 39.11293694608975, lng: 26.562718522083177, name: "Location 6", url: "https://en.wikipedia.org/wiki/Orange_(colour)" }
      ];

      locations.forEach(function(loc) {
        var popupContent = `<b>${loc.name}</b><br><a href="${loc.url}">Click here to visit website</a>`;
        L.marker([loc.lat, loc.lng]).addTo(map).bindPopup(popupContent);
      });

      var userMarker;
      map.locate({ watch: true, setView: true, maxZoom: 16, enableHighAccuracy: true });

      map.on('locationfound', function(e) {
        if (!userMarker) {
          userMarker = L.circleMarker(e.latlng, { 
            radius: 8, 
            color: 'dodgerblue', 
            fillColor: 'dodgerblue', 
            fillOpacity: 0.8 
          }).addTo(map).bindPopup("You are here");
        } else {
          userMarker.setLatLng(e.latlng);
        }
      });
    </script>
    
  </body>
</html>
